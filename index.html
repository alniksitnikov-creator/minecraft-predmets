<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voxel Item 3D (Объемный)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #1e1e1e; color: #eee;
    font-family: system-ui, sans-serif; text-align: center;
    overflow-x: hidden; touch-action: manipulation;
  }
  body { padding: 8px; }
  h2 { font-size: 15px; margin: 4px 0; }
  .row {
    display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; align-items: center; margin: 5px 0;
  }
  button {
    padding: 10px 14px; font-size: 14px; border: none; border-radius: 6px;
    background: #333; color: #eee; cursor: pointer; min-height: 40px;
  }
  button:active { background: #555; }
  button.active-layer { background: #4caf50; color: #fff; font-weight: bold; }
  button.nav-btn { background: #2196F3; color: #fff; font-size: 18px; padding: 8px 16px; font-weight: bold; }
  button.nav-btn:active { background: #1976D2; }
  input[type=color] { width: 45px; height: 40px; border: none; border-radius: 6px; background: transparent; }
  input[type=text] { padding: 8px; font-size: 13px; border-radius: 6px; border: 1px solid #555; background: #2a2a2a; color: #eee; width: 100px; }
  #layerBar { display: flex; overflow-x: auto; gap: 5px; padding: 4px 0; -webkit-overflow-scrolling: touch; }
  #layerBar button { flex: 0 0 auto; min-width: 40px; }
  
  #main-canvas {
    display: block; margin: 10px auto;
    width: 95vw; height: 95vw;
    max-width: 360px; max-height: 360px;
    border: 2px solid #a8e6a8;
    background: #f5f5f5;
    touch-action: none;
  }
  
  .hint { font-size: 11px; color: #aaa; margin: 4px 0; }
</style>
</head>
<body>
<h2>Воксельный редактор (объемный 3D)</h2>

<div class="row">
  <button onclick="prevLayer()">◀ Слой</button>
  <span>Слой: <b id="layerLabel">0</b></span>
  <button onclick="nextLayer()">Слой ▶</button>
  <button onclick="clearLayer()">Очистить</button>
</div>
<div id="layerBar"></div>

<div class="row">
  <label>Цвет: <input type="color" id="color" value="#ff0000"></label>
  <input type="text" id="hex" placeholder="#ff0000">
  <button onclick="applyHex()">OK</button>
</div>

<canvas id="main-canvas"></canvas>

<!-- Кнопки 3D вращения -->
<div class="row" style="margin-top: 10px;">
  <span style="font-size: 13px; width: 100%; color: #aaa; margin-bottom: 5px;">3D Вращение:</span>
  <button class="nav-btn" onclick="rotate3D(0, -0.2)">↑</button>
  <button class="nav-btn" onclick="rotate3D(-0.2, 0)">←</button>
  <button class="nav-btn" onclick="rotate3D(0, 0.2)">↓</button>
  <button class="nav-btn" onclick="rotate3D(0.2, 0)">→</button>
  <button onclick="reset3D()" style="background: #555; margin-left: 10px;">Сброс</button>
</div>

<div class="row">
  <label>Имя: <input type="text" id="name" placeholder="Item"></label>
  <label>ID: <input type="text" id="id" placeholder="my_item"></label>
</div>
<div class="row">
  <button onclick="generate()" style="background:#4caf50;color:#fff;width:100%;max-width:250px;font-size:15px;">Скачать .mcaddon</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const SIZE = 8;
const RES = 360;
let currentLayer = 0;
let voxels = Array.from({length: SIZE}, () => Array.from({length: SIZE}, () => Array(SIZE).fill(null)));

const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
canvas.width = RES;
canvas.height = RES;

// === 2D РИСОВАНИЕ ===
function refresh2D() {
  const cell = RES / SIZE;
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, RES, RES);
  
  ctx.strokeStyle = '#a8e6a8';
  ctx.lineWidth = 1.5;
  for (let i = 0; i <= SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, RES); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(RES, i * cell); ctx.stroke();
  }
  
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const col = voxels[currentLayer][y][x];
      if (col) {
        ctx.fillStyle = col;
        ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
      }
    }
  }
}

// === НАСТОЯЩЕЕ ОБЪЕМНОЕ 3D (С ГРАНЯМИ) ===
let rotX = 0.5, rotY = -0.5; // Начальный угол, чтобы видеть 3 грани
let isViewing3D = false;

function rotate3D(dx, dy) {
  rotY += dx;
  rotX += dy;
  // Ограничиваем наклон, чтобы не переворачивалось
  rotX = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, rotX));
  isViewing3D = true;
  refresh3D();
}

function reset3D() {
  rotX = 0.5; rotY = -0.5;
  isViewing3D = true;
  refresh3D();
}

// Функция затемнения цвета для граней
function shadeColor(color, percent) {
  const num = parseInt(color.replace("#",""),16),
        amt = Math.round(2.55 * percent),
        R = (num >> 16) + amt,
        B = ((num >> 8) & 0x00FF) + amt,
        G = (num & 0x0000FF) + amt;
  return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
}

function refresh3D() {
  ctx.fillStyle = '#e8f5e8'; // Фон 3D
  ctx.fillRect(0, 0, RES, RES);
  
  const cubes = [];
  for (let z = 0; z < SIZE; z++)
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++)
        if (voxels[z][y][x]) cubes.push({x: x - SIZE/2 + 0.5, y: y - SIZE/2 + 0.5, z: z - SIZE/2 + 0.5, color: voxels[z][y][x]});

  if (cubes.length === 0) return;

  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const scale = 40; // Масштаб модели
  const fov = 400; // Перспектива

  // Функция проекции точки
  function project(x, y, z) {
    // Вращение X
    let y1 = y * cosX - z * sinX;
    let z1 = y * sinX + z * cosX;
    // Вращение Y
    let x2 = x * cosY + z1 * sinY;
    let z2 = -x * sinY + z1 * cosY;
    
    const depth = z2 + fov;
    const factor = fov / Math.max(depth, 1);
    
    return {
      x: RES/2 + x2 * factor * scale,
      y: RES/2 - y1 * factor * scale,
      depth: z2
    };
  }

  // Сортируем кубы по глубине (дальние рисуем первыми)
  cubes.sort((a, b) => {
    const pA = project(a.x, a.y, a.z);
    const pB = project(b.x, b.y, b.z);
    return pB.depth - pA.depth;
  });

  // Рисуем каждый куб (с 3 гранями)
  cubes.forEach(c => {
    const size = 0.5; // Половина размера куба
    // 8 вершин куба
    const pts = [
      project(c.x-size, c.y-size, c.z-size), // 0: лев-низ-зад
      project(c.x+size, c.y-size, c.z-size), // 1: прав-низ-зад
      project(c.x+size, c.y+size, c.z-size), // 2: прав-верх-зад
      project(c.x-size, c.y+size, c.z-size), // 3: лев-верх-зад
      project(c.x-size, c.y-size, c.z+size), // 4: лев-низ-перед
      project(c.x+size, c.y-size, c.z+size), // 5: прав-низ-перед
      project(c.x+size, c.y+size, c.z+size), // 6: прав-верх-перед
      project(c.x-size, c.y+size, c.z+size)  // 7: лев-верх-перед
    ];

    const baseColor = c.color;
    
    // Определяем, какие грани видны (по направлению взгляда)
    // Рисуем переднюю грань (5,6,7,4)
    ctx.fillStyle = baseColor;
    ctx.beginPath();
    ctx.moveTo(pts[4].x, pts[4].y);
    ctx.lineTo(pts[5].x, pts[5].y);
    ctx.lineTo(pts[6].x, pts[6].y);
    ctx.lineTo(pts[7].x, pts[7].y);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Верхняя грань (3,2,6,7) - светлее
    if (rotX < 0) {
      ctx.fillStyle = shadeColor(baseColor, 20);
      ctx.beginPath();
      ctx.moveTo(pts[3].x, pts[3].y);
      ctx.lineTo(pts[2].x, pts[2].y);
      ctx.lineTo(pts[6].x, pts[6].y);
      ctx.lineTo(pts[7].x, pts[7].y);
      ctx.fill();
      ctx.stroke();
    }

    // Правая грань (1,5,6,2) - темнее
    if (rotY > 0) {
      ctx.fillStyle = shadeColor(baseColor, -20);
      ctx.beginPath();
      ctx.moveTo(pts[1].x, pts[1].y);
      ctx.lineTo(pts[5].x, pts[5].y);
      ctx.lineTo(pts[6].x, pts[6].y);
      ctx.lineTo(pts[2].x, pts[2].y);
      ctx.fill();
      ctx.stroke();
    }

    // Левая грань (0,4,7,3) - темнее
    if (rotY < 0) {
      ctx.fillStyle = shadeColor(baseColor, -30);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[4].x, pts[4].y);
      ctx.lineTo(pts[7].x, pts[7].y);
      ctx.lineTo(pts[3].x, pts[3].y);
      ctx.fill();
      ctx.stroke();
    }
  });
}

// === СПЛОШНОЕ РИСОВАНИЕ ===
let isDrawing = false;
let lastGridX = -1, lastGridY = -1;

function getGridPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = RES / rect.width;
  const scaleY = RES / rect.height;
  const canvasX = (clientX - rect.left) * scaleX;
  const canvasY = (clientY - rect.top) * scaleY;
  return {
    x: Math.floor(canvasX / (RES / SIZE)),
    y: Math.floor(canvasY / (RES / SIZE))
  };
}

function paint(clientX, clientY) {
  const p = getGridPos(clientX, clientY);
  if (p.x < 0 || p.x >= SIZE || p.y < 0 || p.y >= SIZE) return;

  // Закрашиваем линию (алгоритм Брезенхэма)
  if (lastGridX !== -1 && lastGridY !== -1) {
    let x0 = lastGridX, y0 = lastGridY;
    let x1 = p.x, y1 = p.y;
    let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, e2;

    while (true) {
      voxels[currentLayer][y0][x0] = document.getElementById('color').value;
      if (x0 === x1 && y0 === y1) break;
      e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  } else {
    voxels[currentLayer][p.y][p.x] = document.getElementById('color').value;
  }
  
  lastGridX = p.x;
  lastGridY = p.y;
  refresh2D();
}

// === ОБРАБОТКА КАСАНИЙ (только для 2D) ===
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  isViewing3D = false; // При касании переключаемся на рисование
  isDrawing = true;
  lastGridX = -1; lastGridY = -1;
  paint(e.touches[0].clientX, e.touches[0].clientY);
  refresh2D(); // Показываем сетку
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isDrawing) return;
  paint(e.touches[0].clientX, e.touches[0].clientY);
  refresh2D();
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  isDrawing = false;
  lastGridX = -1; lastGridY = -1;
}, { passive: false });

// Мышь
canvas.addEventListener('mousedown', e => { isViewing3D = false; isDrawing = true; lastGridX = -1; paint(e.clientX, e.clientY); refresh2D(); });
canvas.addEventListener('mousemove', e => { if (isDrawing) { paint(e.clientX, e.clientY); refresh2D(); } });
window.addEventListener('mouseup', () => { isDrawing = false; lastGridX = -1; });

// === КНОПКИ И СЛОИ ===
function updateUI() {
  document.getElementById('layerLabel').textContent = currentLayer;
  const bar = document.getElementById('layerBar');
  bar.innerHTML = '';
  for (let i = 0; i < SIZE; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    if (i === currentLayer) btn.className = 'active-layer';
    btn.onclick = () => { 
      currentLayer = i; 
      isViewing3D = false; // При смене слоя возвращаем сетку
      refresh2D(); 
      updateUI(); 
    };
    bar.appendChild(btn);
  }
}

function prevLayer() { if (currentLayer > 0) { currentLayer--; isViewing3D = false; refresh2D(); updateUI(); } }
function nextLayer() { if (currentLayer < SIZE - 1) { currentLayer++; isViewing3D = false; refresh2D(); updateUI(); } }
function clearLayer() { 
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) voxels[currentLayer][y][x] = null; 
  isViewing3D = false;
  refresh2D(); 
}
function applyHex() { 
  const v = document.getElementById('hex').value.trim(); 
  if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('color').value = v; 
}

// === ГЕНЕРАЦИЯ ПАКА ===
async function generate() {
  const name = document.getElementById('name').value || 'Voxel Item';
  const id = (document.getElementById('id').value || 'voxel_item').replace(/[^a-z0-9_]/gi, '_').toLowerCase();
  const cubes = [];
  for (let z = 0; z < SIZE; z++) for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++)
    if (voxels[z][y][x]) cubes.push({ x, y, z, color: voxels[z][y][x] });

  if (cubes.length === 0) { alert('Нарисуй хотя бы один воксель!'); return; }

  const texCanvas = document.createElement('canvas');
  texCanvas.width = SIZE; texCanvas.height = SIZE;
  const tctx = texCanvas.getContext('2d');
  cubes.forEach(c => { tctx.fillStyle = c.color; tctx.fillRect(c.x, c.y, 1, 1); });
  const texBlob = await new Promise(res => texCanvas.toBlob(res, 'image/png'));

  const geo = { format_version: "1.16.0", "minecraft:geometry": [{ description: { identifier: "geometry." + id, texture_width: SIZE, texture_height: SIZE }, bones: [{ name: "root", pivot: [0, 0, 0], cubes: cubes.map(c => ({ origin: [c.x, c.y, c.z], size: [1,1,1], uv: [c.x, c.y] })) }] }] };
  const bpItem = { format_version: "1.21.90", "minecraft:item": { description: { identifier: id, menu_category: { category: "items", group: "minecraft:itemGroup.name.miscFood" } }, components: { "minecraft:icon": id, "minecraft:max_stack_size": 64, "minecraft:display_name": { value: name } } } };
  const attachable = { format_version: "1.10.0", "minecraft:attachable": { description: { identifier: id, materials: { default: "entity_alphatest" }, textures: { default: "textures/items/" + id }, geometry: { default: "geometry." + id }, render_controllers: ["controller.render.item_default"] } } };

  const zip = new JSZip();
  const bp = zip.folder(id + "_BP");
  bp.file("manifest.json", JSON.stringify({ format_version: 2, header: { name: name + " BP", description: "Behavior", uuid: crypto.randomUUID(), version: [1,0,0] }, modules: [{ type: "data", uuid: crypto.randomUUID(), version: [1,0,0] }] }, null, 2));
  bp.folder("items").file(id + ".json", JSON.stringify(bpItem, null, 2));

  const rp = zip.folder(id + "_RP");
  rp.file("manifest.json", JSON.stringify({ format_version: 2, header: { name: name + " RP", description: "Resources", uuid: crypto.randomUUID(), version: [1,0,0] }, modules: [{ type: "resources", uuid: crypto.randomUUID(), version: [1,0,0] }] }, null, 2));
  rp.folder("textures/items").file(id + ".png", texBlob);
  rp.folder("textures").file("item_texture.json", JSON.stringify({ resource_pack_name: "vanilla", texture_name: "atlas.items", texture_data: { [id]: { textures: "textures/items/" + id } } }, null, 2));
  rp.folder("models/entity").file(id + ".geo.json", JSON.stringify(geo, null, 2));
  rp.folder("attachables").file(id + ".json", JSON.stringify(attachable, null, 2));

  const out = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = id + ".mcaddon";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// СТАРТ
updateUI();
refresh2D();
</script>
</body>
 </html>
