<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voxel Item → MCADDON</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, sans-serif;
    background: #1e1e1e; color: #eee;
    margin: 0; padding: 8px;
    text-align: center;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  h2 { font-size: 16px; margin: 4px 0; }
  .row {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; align-items: center;
    margin: 6px 0;
  }
  button {
    padding: 10px 14px; font-size: 14px;
    border: none; border-radius: 8px;
    background: #333; color: #eee;
    cursor: pointer; min-height: 42px;
  }
  button:active { background: #555; }
  button.active-layer { background: #4caf50; color: #fff; }
  input[type=color] { width: 50px; height: 42px; border: none; border-radius: 8px; background: transparent; }
  input[type=text] {
    padding: 9px; font-size: 14px; border-radius: 8px;
    border: 1px solid #555; background: #2a2a2a; color: #eee;
    width: 100%; max-width: 180px;
  }
  #hex { max-width: 100px; }
  #layerBar {
    display: flex; overflow-x: auto; gap: 6px; padding: 4px 0;
    -webkit-overflow-scrolling: touch;
  }
  #layerBar button { flex: 0 0 auto; min-width: 42px; }
  canvas {
    image-rendering: pixelated;
    display: block; margin: 4px auto;
    touch-action: none; /* КРИТИЧНО для телефона */
  }
  #c2d {
    border: 2px solid #a8e6a8;
    background: #f5f5f5;
    width: 90vw; height: 90vw;
    max-width: 360px; max-height: 360px;
  }
  #c3d {
    border: 2px solid #a8e6a8;
    background: #e8f5e8;
    width: 90vw; height: 50vw;
    max-width: 360px; max-height: 200px;
  }
  .hint { font-size: 11px; color: #aaa; margin: 2px 0; }
  .field { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .field label { font-size: 12px; color: #ccc; }
</style>
</head>
<body>
<h2>Воксельный предмет → .mcaddon</h2>

<div class="row">
  <button onclick="prevLayer()">◀</button>
  <span>Слой: <b id="layerLabel">0</b></span>
  <button onclick="nextLayer()">▶</button>
  <button onclick="clearLayer()">Очистить</button>
</div>
<div id="layerBar"></div>

<div class="row">
  <label>Цвет: <input type="color" id="color" value="#ff0000"></label>
  <input type="text" id="hex" placeholder="#ff0000">
  <button onclick="applyHex()">OK</button>
</div>

<canvas id="c2d" width="8" height="8"></canvas>
<p class="hint">Рисуй пальцем. Сетка светлая, линии бело-зелёные.</p>

<div class="row">
  <button onclick="update3D()" style="background:#4caf50;color:#fff;">Обновить 3D</button>
  <label style="font-size:13px;"><input type="checkbox" id="auto3d" checked> Авто-3D</label>
</div>

<canvas id="c3d"></canvas>
<p class="hint">Крути 3D модель пальцем (drag).</p>

<div class="row">
  <div class="field">
    <label>Название</label>
    <input type="text" id="name" placeholder="Мой предмет">
  </div>
  <div class="field">
    <label>ID</label>
    <input type="text" id="id" placeholder="my_item">
  </div>
</div>
<div class="row">
  <button onclick="generate()" style="background:#4caf50;color:#fff;font-size:16px;padding:14px 24px;">Скачать .mcaddon</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SIZE = 8;
let currentLayer = 0;
let voxels = Array.from({length: SIZE}, () => Array.from({length: SIZE}, () => Array(SIZE).fill(null)));

// ===== 2D РЕДАКТОР =====
const c2d = document.getElementById('c2d');
const ctx = c2d.getContext('2d');
let painting = false;

function renderLayerBar() {
  const bar = document.getElementById('layerBar');
  bar.innerHTML = '';
  for (let i = 0; i < SIZE; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    if (i === currentLayer) btn.classList.add('active-layer');
    btn.onclick = () => { currentLayer = i; refresh2D(); renderLayerBar(); if (document.getElementById('auto3d').checked) update3D(); };
    bar.appendChild(btn);
  }
  document.getElementById('layerLabel').textContent = currentLayer;
}

function refresh2D() {
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.strokeStyle = '#a8e6a8';
  ctx.lineWidth = 0.08;
  for (let i = 0; i <= SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(SIZE, i); ctx.stroke();
  }
  for (let y = 0; y < SIZE; y++)
    for (let x = 0; x < SIZE; x++) {
      const col = voxels[currentLayer][y][x];
      if (col) { ctx.fillStyle = col; ctx.fillRect(x + 0.04, y + 0.04, 0.92, 0.92); }
    }
}

function pos2D(e) {
  const r = c2d.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left) / r.width * SIZE),
    y: Math.floor((e.clientY - r.top) / r.height * SIZE)
  };
}

c2d.addEventListener('pointerdown', e => {
  e.preventDefault(); painting = true; c2d.setPointerCapture(e.pointerId); paint(e);
});
c2d.addEventListener('pointermove', e => { if (painting) { e.preventDefault(); paint(e); } });
c2d.addEventListener('pointerup', () => painting = false);
c2d.addEventListener('pointercancel', () => painting = false);

function paint(e) {
  const p = pos2D(e);
  if (p.x < 0 || p.x >= SIZE || p.y < 0 || p.y >= SIZE) return;
  const col = document.getElementById('color').value;
  voxels[currentLayer][p.y][p.x] = col;
  refresh2D();
  if (document.getElementById('auto3d').checked) update3D();
}

function clearLayer() {
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) voxels[currentLayer][y][x] = null;
  refresh2D(); update3D();
}
function prevLayer() { if (currentLayer > 0) { currentLayer--; refresh2D(); renderLayerBar(); update3D(); } }
function nextLayer() { if (currentLayer < SIZE - 1) { currentLayer++; refresh2D(); renderLayerBar(); update3D(); } }
function applyHex() {
  const v = document.getElementById('hex').value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('color').value = v;
}

// ===== 3D ПРЕВЬЮ =====
const c3d = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas: c3d, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8f5e8);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
camera.position.set(10, 10, 14);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

let modelGroup = new THREE.Group();
scene.add(modelGroup);

let rotX = -0.5, rotY = 0.6;
let dragging = false, lastX = 0, lastY = 0;

// КРИТИЧНО: preventDefault + capture
c3d.addEventListener('pointerdown', e => {
  e.preventDefault();
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  c3d.setPointerCapture(e.pointerId);
});
c3d.addEventListener('pointermove', e => {
  if (!dragging) return;
  e.preventDefault();
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  rotY += dx * 0.01;
  rotX += dy * 0.01;
  rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
});
c3d.addEventListener('pointerup', () => dragging = false);
c3d.addEventListener('pointercancel', () => dragging = false);

function resize3D() {
  const w = c3d.clientWidth, h = c3d.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize3D);

function update3D() {
  while (modelGroup.children.length) {
    const obj = modelGroup.children.pop();
    obj.geometry?.dispose();
    obj.material?.dispose();
  }
  const geom = new THREE.BoxGeometry(1, 1, 1);
  for (let z = 0; z < SIZE; z++)
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++) {
        const col = voxels[z][y][x];
        if (!col) continue;
        const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(col) });
        const cube = new THREE.Mesh(geom, mat);
        cube.position.set(x - SIZE/2 + 0.5, y - SIZE/2 + 0.5, z - SIZE/2 + 0.5);
        modelGroup.add(cube);
      }
  const box = new THREE.Box3().setFromObject(modelGroup);
  const center = box.getCenter(new THREE.Vector3());
  modelGroup.position.sub(center);
}

function animate() {
  requestAnimationFrame(animate);
  modelGroup.rotation.x = rotX;
  modelGroup.rotation.y = rotY;
  renderer.render(scene, camera);
}

// ===== ГЕНЕРАЦИЯ .MCADDON =====
async function generate() {
  const name = document.getElementById('name').value || 'Voxel Item';
  const id = document.getElementById('id').value || 'voxel_item';

  const cubes = [];
  for (let z = 0; z < SIZE; z++)
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++)
        if (voxels[z][y][x]) cubes.push({ x, y, z, color: voxels[z][y][x] });

  if (cubes.length === 0) { alert('Нарисуй хотя бы один воксель!'); return; }

  const texCanvas = document.createElement('canvas');
  texCanvas.width = SIZE; texCanvas.height = SIZE;
  const tctx = texCanvas.getContext('2d');
  cubes.forEach(cube => {
    tctx.fillStyle = cube.color;
    tctx.fillRect(cube.x, cube.y, 1, 1);
  });
  const texBlob = await new Promise(res => texCanvas.toBlob(res, 'image/png'));

  const geo = {
    format_version: "1.16.0",
    "minecraft:geometry": [{
      description: { identifier: "geometry." + id, texture_width: SIZE, texture_height: SIZE },
      bones: [{
        name: "root", pivot: [0, 0, 0],
        cubes: cubes.map(cube => ({
          origin: [cube.x, cube.y, cube.z],
          size: [1, 1, 1],
          uv: [cube.x, cube.y]
        }))
      }]
    }]
  };

  const bpItem = {
    format_version: "1.21.90",
    "minecraft:item": {
      description: {
        identifier: id,
        menu_category: { category: "items", group: "minecraft:itemGroup.name.miscFood" }
      },
      components: {
        "minecraft:icon": id,
        "minecraft:max_stack_size": 64,
        "minecraft:display_name": { value: name }
      }
    }
  };

  const attachable = {
    format_version: "1.10.0",
    "minecraft:attachable": {
      description: {
        identifier: id,
        materials: { default: "entity_alphatest", enchanted: "entity_alphatest_glint" },
        textures: { default: "textures/items/" + id, enchanted: "textures/misc/enchanted_item_glint" },
        geometry: { default: "geometry." + id },
        render_controllers: ["controller.render.item_default"]
      }
    }
  };

  // ВАЖНО: .mcaddon — это ZIP с расширением .mcaddon
  const zip = new JSZip();
  const bp = zip.folder(id + "_BP");
  bp.file("manifest.json", JSON.stringify({
    format_version: 2,
    header: { name: name + " BP", description: "Behavior", uuid: crypto.randomUUID(), version: [1,0,0] },
    modules: [{ type: "data", uuid: crypto.randomUUID(), version: [1,0,0] }]
  }, null, 2));
  bp.folder("items").file(id + ".json", JSON.stringify(bpItem, null, 2));

  const rp = zip.folder(id + "_RP");
  rp.file("manifest.json", JSON.stringify({
    format_version: 2,
    header: { name: name + " RP", description: "Resources", uuid: crypto.randomUUID(), version: [1,0,0] },
    modules: [{ type: "resources", uuid: crypto.randomUUID(), version: [1,0,0] }]
  }, null, 2));
  rp.folder("textures/items").file(id + ".png", texBlob);
  rp.folder("textures").file("item_texture.json", JSON.stringify({
    resource_pack_name: "vanilla", texture_name: "atlas.items",
    texture_data: { [id]: { textures: "textures/items/" + id } }
  }, null, 2));
  rp.folder("models/entity").file(id + ".geo.json", JSON.stringify(geo, null, 2));
  rp.folder("attachables").file(id + ".json", JSON.stringify(attachable, null, 2));

  const out = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = id + ".mcaddon";  // <-- расширение .mcaddon!
  a.click();
  alert("Готово! Открой скачанный .mcaddon — Minecraft должен предложить импорт.");
}

// ===== СТАРТ =====
renderLayerBar();
refresh2D();
resize3D();
update3D();
animate();
</script>
</body>
</html>
