<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voxel Item → MCADDON</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #1e1e1e; color: #eee;
    font-family: system-ui, sans-serif; text-align: center;
    overflow: hidden; touch-action: none; /* Отключаем зум и скролл */
  }
  body { display: flex; flex-direction: column; height: 100vh; padding: 8px; }
  h2 { font-size: 16px; margin: 4px 0; }
  .row {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin: 4px 0;
  }
  button {
    padding: 10px 14px; font-size: 14px; border: none; border-radius: 8px;
    background: #333; color: #eee; cursor: pointer; min-height: 44px;
  }
  button:active { background: #555; }
  button.active-layer { background: #4caf50; color: #fff; }
  input[type=color] { width: 50px; height: 44px; border: none; border-radius: 8px; background: transparent; }
  input[type=text] { padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #555; background: #2a2a2a; color: #eee; width: 100%; max-width: 140px; }
  #layerBar { display: flex; overflow-x: auto; gap: 6px; padding: 4px 0; -webkit-overflow-scrolling: touch; }
  #layerBar button { flex: 0 0 auto; min-width: 44px; }
  
  /* ЕДИНОЕ ОКНО */
  #main-canvas {
    flex-grow: 1; /* Занимает все свободное место */
    width: 100%; max-width: 500px;
    margin: 6px auto; border: 2px solid #a8e6a8;
    touch-action: none; display: block;
    image-rendering: pixelated;
  }
  
  .hint { font-size: 12px; color: #aaa; margin: 2px 0; }
  .field { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .field label { font-size: 12px; color: #ccc; }
</style>
</head>
<body>
<h2>1 палец — рисовать, 2 пальца — крутить 3D</h2>

<div class="row">
  <button onclick="prevLayer()">◀ Слой</button>
  <span>Слой: <b id="layerLabel">0</b></span>
  <button onclick="nextLayer()">Слой ▶</button>
  <button onclick="clearLayer()">Очистить</button>
</div>
<div id="layerBar"></div>

<div class="row">
  <label>Цвет: <input type="color" id="color" value="#ff0000"></label>
  <input type="text" id="hex" placeholder="#ff0000">
  <button onclick="applyHex()">OK</button>
</div>

<!-- ЕДИНЫЙ CANVAS -->
<canvas id="main-canvas"></canvas>
<p class="hint" id="modeHint">Режим: Рисование (1 палец)</p>

<div class="row">
  <div class="field">
    <label>Название</label>
    <input type="text" id="name" placeholder="Мой предмет">
  </div>
  <div class="field">
    <label>ID</label>
    <input type="text" id="id" placeholder="my_item">
  </div>
</div>
<div class="row">
  <button onclick="generate()" style="background:#4caf50;color:#fff;font-size:16px;width:100%;">Скачать .mcaddon</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SIZE = 8;
let currentLayer = 0;
let voxels = Array.from({length: SIZE}, () => Array.from({length: SIZE}, () => Array(SIZE).fill(null)));

// ==========================================
// 2D РЕНДЕР (РИСОВАНИЕ)
// ==========================================
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height);
  canvas.width = size;
  canvas.height = size;
  refresh2D();
  if (renderer) { renderer.setSize(size, size, false); camera.aspect = 1; camera.updateProjectionMatrix(); }
}

function refresh2D() {
  const w = canvas.width;
  const h = canvas.height;
  const cell = w / SIZE;
  
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, w, h);
  
  ctx.strokeStyle = '#a8e6a8';
  ctx.lineWidth = 1;
  for (let i = 0; i <= SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(w, i * cell); ctx.stroke();
  }
  
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const col = voxels[currentLayer][y][x];
      if (col) {
        ctx.fillStyle = col;
        ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
      }
    }
  }
}

// ==========================================
// 3D РЕНДЕР (THREE.JS)
// ==========================================
const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0); // Прозрачный фон
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
camera.position.set(0, 0, 25); // Камера смотрит ровно в центр

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const modelGroup = new THREE.Group();
scene.add(modelGroup);

let rotX = -0.5, rotY = 0.6;

function rebuild3D() {
  while (modelGroup.children.length) {
    const obj = modelGroup.children.pop();
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  }
  const geom = new THREE.BoxGeometry(1, 1, 1);
  for (let z = 0; z < SIZE; z++) {
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const col = voxels[z][y][x];
        if (!col) continue;
        const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(col) });
        const cube = new THREE.Mesh(geom, mat);
        cube.position.set(x - SIZE / 2 + 0.5, y - SIZE / 2 + 0.5, z - SIZE / 2 + 0.5);
        modelGroup.add(cube);
      }
    }
  }
  // Автоматически подгоняем камеру под размер модели, чтобы она не была в углу
  const box = new THREE.Box3().setFromObject(modelGroup);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.z = maxDim * 2.5 + 10;
  camera.lookAt(0, 0, 0);
}

// ==========================================
// УПРАВЛЕНИЕ (1 ПАЛЕЦ = РИСОВАТЬ, 2 = КРУТИТЬ)
// ==========================================
let isDrawing = false;
let isRotating = false;
let lastTouchDist = 0;
let lastRotX = 0, lastRotY = 0;

const modeHint = document.getElementById('modeHint');

function getTouchPos(touch) {
  const rect = canvas.getBoundingClientRect();
  const cell = rect.width / SIZE;
  return {
    x: Math.floor((touch.clientX - rect.left) / cell),
    y: Math.floor((touch.clientY - rect.top) / cell)
  };
}

function paint(touch) {
  const p = getTouchPos(touch);
  if (p.x >= 0 && p.x < SIZE && p.y >= 0 && p.y < SIZE) {
    voxels[currentLayer][p.y][p.x] = document.getElementById('color').value;
    refresh2D();
    rebuild3D();
  }
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    // РИСОВАНИЕ
    isDrawing = true;
    isRotating = false;
    modeHint.textContent = "Режим: Рисование (1 палец)";
    refresh2D();
    paint(e.touches[0]);
  } else if (e.touches.length === 2) {
    // ВРАЩЕНИЕ
    isDrawing = false;
    isRotating = true;
    modeHint.textContent = "Режим: 3D Вращение (2 пальца)";
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.hypot(dx, dy);
    lastRotX = e.touches[0].clientX;
    lastRotY = e.touches[0].clientY;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (isDrawing && e.touches.length === 1) {
    paint(e.touches[0]);
  } else if (isRotating && e.touches.length === 2) {
    const dx = e.touches[0].clientX - lastRotX;
    const dy = e.touches[0].clientY - lastRotY;
    lastRotX = e.touches[0].clientX;
    lastRotY = e.touches[0].clientY;
    rotY += dx * 0.01;
    rotX += dy * 0.01;
    rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length === 0) {
    isDrawing = false;
    isRotating = false;
    modeHint.textContent = "Режим: Рисование (1 палец)";
    refresh2D(); // Возвращаем сетку
  } else if (e.touches.length === 1 && isRotating) {
    // Если после вращения остался 1 палец — переходим в рисование
    isRotating = false;
    isDrawing = true;
    modeHint.textContent = "Режим: Рисование (1 палец)";
    refresh2D();
    paint(e.touches[0]);
  }
}, { passive: false });

// Отрисовка 3D (постоянный цикл)
function animate() {
  requestAnimationFrame(animate);
  if (isRotating) {
    ctx.clearRect(0, 0, canvas.width, canvas.height); // Стираем 2D сетку
    modelGroup.rotation.x = rotX;
    modelGroup.rotation.y = rotY;
    renderer.render(scene, camera);
  }
}

// ==========================================
// ГЕНЕРАЦИЯ ПАКА
// ==========================================
async function generate() {
  const name = document.getElementById('name').value || 'Voxel Item';
  const id = (document.getElementById('id').value || 'voxel_item').replace(/[^a-z0-9_]/gi, '_').toLowerCase();

  const cubes = [];
  for (let z = 0; z < SIZE; z++)
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++)
        if (voxels[z][y][x]) cubes.push({ x, y, z, color: voxels[z][y][x] });

  if (cubes.length === 0) { alert('Нарисуй хотя бы один воксель!'); return; }

  const texCanvas = document.createElement('canvas');
  texCanvas.width = SIZE; texCanvas.height = SIZE;
  const tctx = texCanvas.getContext('2d');
  cubes.forEach(c => { tctx.fillStyle = c.color; tctx.fillRect(c.x, c.y, 1, 1); });
  const texBlob = await new Promise(res => texCanvas.toBlob(res, 'image/png'));

  const geo = {
    format_version: "1.16.0",
    "minecraft:geometry": [{
      description: { identifier: "geometry." + id, texture_width: SIZE, texture_height: SIZE },
      bones: [{ name: "root", pivot: [0, 0, 0], cubes: cubes.map(c => ({ origin: [c.x, c.y, c.z], size: [1,1,1], uv: [c.x, c.y] })) }]
    }]
  };

  const bpItem = {
    format_version: "1.21.90",
    "minecraft:item": {
      description: { identifier: id, menu_category: { category: "items", group: "minecraft:itemGroup.name.miscFood" } },
      components: { "minecraft:icon": id, "minecraft:max_stack_size": 64, "minecraft:display_name": { value: name } }
    }
  };

  const attachable = {
    format_version: "1.10.0",
    "minecraft:attachable": {
      description: {
        identifier: id, materials: { default: "entity_alphatest" },
        textures: { default: "textures/items/" + id },
        geometry: { default: "geometry." + id },
        render_controllers: ["controller.render.item_default"]
      }
    }
  };

  const zip = new JSZip();
  const bp = zip.folder(id + "_BP");
  bp.file("manifest.json", JSON.stringify({ format_version: 2, header: { name: name + " BP", description: "Behavior", uuid: crypto.randomUUID(), version: [1,0,0] }, modules: [{ type: "data", uuid: crypto.randomUUID(), version: [1,0,0] }] }, null, 2));
  bp.folder("items").file(id + ".json", JSON.stringify(bpItem, null, 2));

  const rp = zip.folder(id + "_RP");
  rp.file("manifest.json", JSON.stringify({ format_version: 2, header: { name: name + " RP", description: "Resources", uuid: crypto.randomUUID(), version: [1,0,0] }, modules: [{ type: "resources", uuid: crypto.randomUUID(), version: [1,0,0] }] }, null, 2));
  rp.folder("textures/items").file(id + ".png", texBlob);
  rp.folder("textures").file("item_texture.json", JSON.stringify({ resource_pack_name: "vanilla", texture_name: "atlas.items", texture_data: { [id]: { textures: "textures/items/" + id } } }, null, 2));
  rp.folder("models/entity").file(id + ".geo.json", JSON.stringify(geo, null, 2));
  rp.folder("attachables").file(id + ".json", JSON.stringify(attachable, null, 2));

  const out = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = id + ".mcaddon";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  
  alert("Файл скачан!\n\n1. Нажми на него в загрузках.\n2. Выбери 'Открыть с помощью Minecraft'.\n3. Зайди в настройки мира и активируй ОБА пака (Ресурсы и Поведение).");
}

// ==========================================
// СТАРТ
// ==========================================
function prevLayer() { if (currentLayer > 0) { currentLayer--; refresh2D(); rebuild3D(); renderLayerBar(); } }
function nextLayer() { if (currentLayer < SIZE - 1) { currentLayer++; refresh2D(); rebuild3D(); renderLayerBar(); } }
function clearLayer() { for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) voxels[currentLayer][y][x] = null; refresh2D(); rebuild3D(); }
function applyHex() { const v = document.getElementById('hex').value.trim(); if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('color').value = v; }
function renderLayerBar() {
  const bar = document.getElementById('layerBar'); bar.innerHTML = '';
  for (let i = 0; i < SIZE; i++) {
    const btn = document.createElement('button'); btn.textContent = i;
    if (i === currentLayer) btn.classList.add('active-layer');
    btn.onclick = () => { currentLayer = i; refresh2D(); rebuild3D(); renderLayerBar(); };
    bar.appendChild(btn);
  }
  document.getElementById('layerLabel').textContent = currentLayer;
}

window.addEventListener('resize', resizeCanvas);
renderLayerBar();
setTimeout(() => { resizeCanvas(); rebuild3D(); animate(); }, 100);
</script>
</body>
</html>
