<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voxel Item Mobile</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, sans-serif;
    background: #1e1e1e; color: #eee;
    margin: 0; padding: 10px;
    text-align: center;
    touch-action: manipulation;
  }
  h2 { font-size: 18px; margin: 6px 0; }
  .row {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; align-items: center;
    margin: 6px 0;
  }
  button {
    padding: 10px 14px; font-size: 15px;
    border: none; border-radius: 8px;
    background: #333; color: #eee;
    cursor: pointer; min-height: 44px;
  }
  button:active { background: #555; }
  button.active-layer { background: #4caf50; color: #fff; }
  input[type=color] {
    width: 54px; height: 44px; border: none;
    border-radius: 8px; background: transparent;
  }
  input[type=text] {
    padding: 10px; font-size: 15px; border-radius: 8px;
    border: 1px solid #555; background: #2a2a2a; color: #eee;
    width: 100%; max-width: 200px;
  }
  #hex { max-width: 100px; }
  #layerBar {
    display: flex; overflow-x: auto;
    gap: 6px; padding: 4px 0;
    -webkit-overflow-scrolling: touch;
  }
  #layerBar button { flex: 0 0 auto; min-width: 44px; }
  canvas {
    border: 2px solid #555;
    image-rendering: pixelated;
    width: 90vw; height: 90vw;
    max-width: 400px; max-height: 400px;
    touch-action: none; /* чтобы палец не скроллил страницу при рисовании */
    display: block; margin: 8px auto;
  }
  .hint { font-size: 12px; color: #aaa; margin: 4px 0; }
  .field { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .field label { font-size: 13px; color: #ccc; }
</style>
</head>
<body>
<h2>Воксельный предмет (телефон)</h2>

<div class="row">
  <button onclick="prevLayer()">◀ Слой</button>
  <span>Слой: <b id="layerLabel">0</b></span>
  <button onclick="nextLayer()">Слой ▶</button>
  <button onclick="clearLayer()">Очистить</button>
</div>

<div id="layerBar"></div>

<div class="row">
  <label>Цвет: <input type="color" id="color" value="#ff0000"></label>
  <input type="text" id="hex" placeholder="#ff0000">
  <button onclick="applyHex()">OK</button>
</div>

<canvas id="c" width="8" height="8"></canvas>
<p class="hint">Рисуй пальцем. Слои — кнопками выше.</p>

<div class="row">
  <div class="field">
    <label>Название</label>
    <input type="text" id="name" placeholder="Мой предмет">
  </div>
  <div class="field">
    <label>ID</label>
    <input type="text" id="id" placeholder="my_item">
  </div>
</div>

<div class="row">
  <button onclick="generate()" style="background:#4caf50;color:#fff;font-size:17px;padding:14px 24px;">Скачать пак</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const SIZE = 8;
let currentLayer = 0;
let voxels = Array.from({length: SIZE}, () => Array.from({length: SIZE}, () => Array(SIZE).fill(null)));

const c = document.getElementById('c');
const ctx = c.getContext('2d');
let painting = false;

function renderLayerBar() {
  const bar = document.getElementById('layerBar');
  bar.innerHTML = '';
  for (let i = 0; i < SIZE; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    if (i === currentLayer) btn.classList.add('active-layer');
    btn.onclick = () => { currentLayer = i; refreshCanvas(); renderLayerBar(); };
    bar.appendChild(btn);
  }
  document.getElementById('layerLabel').textContent = currentLayer;
}

function refreshCanvas() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const col = voxels[currentLayer][y][x];
      if (col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
    }
  }
}

function pos(e) {
  const r = c.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left) / r.width * SIZE),
    y: Math.floor((e.clientY - r.top) / r.height * SIZE)
  };
}

// pointer события — работают и пальцем, и мышью
c.addEventListener('pointerdown', e => {
  e.preventDefault();
  painting = true;
  c.setPointerCapture(e.pointerId);
  paint(e);
});
c.addEventListener('pointermove', e => {
  if (!painting) return;
  e.preventDefault();
  paint(e);
});
c.addEventListener('pointerup', () => painting = false);
c.addEventListener('pointercancel', () => painting = false);

function paint(e) {
  const p = pos(e);
  if (p.x < 0 || p.x >= SIZE || p.y < 0 || p.y >= SIZE) return;
  const col = document.getElementById('color').value;
  voxels[currentLayer][p.y][p.x] = col;
  ctx.fillStyle = col;
  ctx.fillRect(p.x, p.y, 1, 1);
}

function clearLayer() {
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) voxels[currentLayer][y][x] = null;
  refreshCanvas();
}
function prevLayer() { if (currentLayer > 0) { currentLayer--; refreshCanvas(); renderLayerBar(); } }
function nextLayer() { if (currentLayer < SIZE - 1) { currentLayer++; refreshCanvas(); renderLayerBar(); } }
function applyHex() {
  const v = document.getElementById('hex').value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('color').value = v;
  else alert('HEX вида #rrggbb');
}

async function generate() {
  const name = document.getElementById('name').value || 'Voxel Item';
  const id = document.getElementById('id').value || 'voxel_item';

  const cubes = [];
  for (let z = 0; z < SIZE; z++)
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++)
        if (voxels[z][y][x]) cubes.push({ x, y, z, color: voxels[z][y][x] });

  if (cubes.length === 0) { alert('Нарисуй хотя бы один воксель!'); return; }

  // Текстура-атлас 8x8
  const texCanvas = document.createElement('canvas');
  texCanvas.width = SIZE; texCanvas.height = SIZE;
  const tctx = texCanvas.getContext('2d');
  cubes.forEach(cube => {
    tctx.fillStyle = cube.color;
    tctx.fillRect(cube.x, cube.y, 1, 1);
  });
  const texBlob = await new Promise(res => texCanvas.toBlob(res, 'image/png'));

  const geo = {
    format_version: "1.16.0",
    "minecraft:geometry": [{
      description: { identifier: "geometry." + id, texture_width: SIZE, texture_height: SIZE },
      bones: [{
        name: "root", pivot: [0, 0, 0],
        cubes: cubes.map(cube => ({
          origin: [cube.x, cube.y, cube.z],
          size: [1, 1, 1],
          uv: [cube.x, cube.y]
        }))
      }]
    }]
  };

  const bpItem = {
    format_version: "1.21.90",
    "minecraft:item": {
      description: {
        identifier: id,
        menu_category: { category: "items", group: "minecraft:itemGroup.name.miscFood" }
      },
      components: {
        "minecraft:icon": id,
        "minecraft:max_stack_size": 64,
        "minecraft:display_name": { value: name }
      }
    }
  };

  const attachable = {
    format_version: "1.10.0",
    "minecraft:attachable": {
      description: {
        identifier: id,
        materials: { default: "entity_alphatest", enchanted: "entity_alphatest_glint" },
        textures: { default: "textures/items/" + id, enchanted: "textures/misc/enchanted_item_glint" },
        geometry: { default: "geometry." + id },
        render_controllers: ["controller.render.item_default"]
      }
    }
  };

  const zip = new JSZip();
  const bp = zip.folder(id + "_BP");
  bp.file("manifest.json", JSON.stringify({
    format_version: 2,
    header: { name: name + " BP", description: "Behavior", uuid: crypto.randomUUID(), version: [1,0,0] },
    modules: [{ type: "data", uuid: crypto.randomUUID(), version: [1,0,0] }]
  }, null, 2));
  bp.folder("items").file(id + ".json", JSON.stringify(bpItem, null, 2));

  const rp = zip.folder(id + "_RP");
  rp.file("manifest.json", JSON.stringify({
    format_version: 2,
    header: { name: name + " RP", description: "Resources", uuid: crypto.randomUUID(), version: [1,0,0] },
    modules: [{ type: "resources", uuid: crypto.randomUUID(), version: [1,0,0] }]
  }, null, 2));
  rp.folder("textures/items").file(id + ".png", texBlob);
  rp.folder("textures").file("item_texture.json", JSON.stringify({
    resource_pack_name: "vanilla", texture_name: "atlas.items",
    texture_data: { [id]: { textures: "textures/items/" + id } }
  }, null, 2));
  rp.folder("models/entity").file(id + ".geo.json", JSON.stringify(geo, null, 2));
  rp.folder("attachables").file(id + ".json", JSON.stringify(attachable, null, 2));

  const out = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = id + ".zip";
  a.click();
  alert("Готово! Распакуй ZIP → внутри BP и RP → импортируй оба в Minecraft.");
}

renderLayerBar();
refreshCanvas();
</script>
</body>
</html>
